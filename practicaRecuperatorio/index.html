<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Local Server - Proyecto Unificado</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/styles2.css" />
</head>
<body>
  <main>
    <div class="container">
      <header>
        <h1>CRUD Local Server</h1>
      </header>

      <div class="controls">
        <button class="btn btn-get" onclick="getData()">Obtener Posts (GET)</button>
        <button class="btn btn-put" onclick="putData()">Actualizar Post (PUT)</button>
        <button class="btn btn-delete" onclick="deleteData()">Eliminar Post (DELETE)</button>
      </div>

      <div class="formContainer">
        <form id="taskForm" data-form>
          <input type="text" placeholder="Tarea" data-input-task required />
          <input type="date" data-input-fecha required />
          <input type="text" placeholder="Nombre" data-input-nombre required />
          <input type="number" placeholder="Valor Entero" data-input-valor required />
          <button type="submit">Agregar</button>
        </form>
      </div>

      <div class="results">
        <h3>Resultados:</h3>
        <div id="status"></div>
        <pre id="result">RESULTADO..</pre>
      </div>

      <div class="contentContainer">
        <div class="tableContainer">
          <h2>Lista de Tareas</h2>
          <table id="taskTable">
            <thead>
              <tr>
                <th>Tarea</th>
                <th>Fecha</th>
                <th>Nombre</th>
                <th>Valor</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/get.js"></script>
    <script src="js/post.js"></script>
    <script src="js/put.js"></script>
    <script src="js/delete.js"></script>
    <script src="js/form.js"></script>

    <script>
      function showResult(data, isError = false) {
        const statusEl = document.getElementById('status');
        const resultEl = document.getElementById('result');
        if (isError) {
          statusEl.innerHTML = '<div class="status status-error">Error en la operación</div>';
          resultEl.textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
        } else {
          statusEl.innerHTML = '<div class="status status-success">Operación exitosa</div>';
          resultEl.textContent = JSON.stringify(data, null, 2);
        }
      }
    </script>
  </main>
</body>
</html>
